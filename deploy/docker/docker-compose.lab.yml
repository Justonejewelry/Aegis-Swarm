# Lab: Postgres + Redis Sentinel + Elastic + API + worker + Grafana
# docker compose -f deploy/docker/docker-compose.lab.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_only
      POSTGRES_DB: aegis
    ports: ["5432:5432"]
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
      - ../../schemas/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      redis-master:
        condition: service_healthy
  sentinel1:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/sentinel.conf <<'CONF'
        port 26379
        sentinel monitor aegis-master redis-master 6379 2
        sentinel down-after-milliseconds aegis-master 5000
        sentinel failover-timeout aegis-master 10000
        CONF
        redis-sentinel /tmp/sentinel.conf
    depends_on: [redis-master]
  sentinel2:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/sentinel.conf <<'CONF'
        port 26379
        sentinel monitor aegis-master redis-master 6379 2
        sentinel down-after-milliseconds aegis-master 5000
        CONF
        redis-sentinel /tmp/sentinel.conf
    depends_on: [redis-master]
  sentinel3:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/sentinel.conf <<'CONF'
        port 26379
        sentinel monitor aegis-master redis-master 6379 2
        sentinel down-after-milliseconds aegis-master 5000
        CONF
        redis-sentinel /tmp/sentinel.conf
    depends_on: [redis-master]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis_dev_only@postgres:5432/aegis
      AEGIS_REDIS_MODE: sentinel
      AEGIS_REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      AEGIS_REDIS_MASTER_NAME: aegis-master
      AEGIS_ELASTIC_URL: http://elasticsearch:9200
      AEGIS_ENV: lab
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["python", "-m", "aegis.messaging.worker"]
    environment:
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis_dev_only@postgres:5432/aegis
      AEGIS_REDIS_MODE: sentinel
      AEGIS_REDIS_SENTINELS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      AEGIS_REDIS_MASTER_NAME: aegis-master
      AEGIS_WORKER_DOMAINS: "*"
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aegis_dev_only
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  lab_pgdata:
