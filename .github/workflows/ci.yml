name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + integration tests
        run: pytest -q --tb=short
        env:
          AEGIS_ENV: test
          AEGIS_PERSIST_FINDINGS: "false"
          AEGIS_PERSIST_AUDIT: "false"

      - name: Ruff lint
        run: ruff check src tests

      - name: Import smoke
        run: |
          python -c "from aegis.api.main import app; print('routes', len(app.routes))"
          python -c "from aegis.core.registry import build_default_agents; print('agents', len(build_default_agents()))"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/docker/Dockerfile -t aegis-swarm:ci .
